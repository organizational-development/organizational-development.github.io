<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Organizational Development">
  <rect width="32" height="32" rx="6" fill="#1f6f5c"/>
  <!-- An organization drawn as a network: one node above, three connected below,
       because the subject is the relationships rather than the boxes. -->
  <path d="M16 9 L8 22 M16 9 L24 22 M8 22 L24 22" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <circle cx="16" cy="9" r="3.4" fill="#ffffff"/>
  <circle cx="8" cy="22" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="24" cy="22" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
