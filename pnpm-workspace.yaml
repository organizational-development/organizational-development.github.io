# esbuild's install script links the prebuilt binary for the current platform,
# so Vite cannot run without it. pnpm 11 blocks dependency build scripts unless
# they are allowed here, and `sv create` writes a placeholder string that fails
# every later `pnpm install --frozen-lockfile` until it is set to a real boolean.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
